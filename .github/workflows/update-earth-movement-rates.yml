name: Update Earth Movement Rates

on:
  workflow_dispatch:
  schedule:
    - cron: "50 15 * * *"

permissions:
  contents: write

jobs:
  update-earth-movement-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate Earth Movement rates JSON
        run: node scripts/generate-earth-movement-rates.js

      - name: Commit updated Earth Movement rates JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Earth Movement rates JSON"
          file_pattern: earth-movement-rates.json
